name: ci

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  build:
    name: install, build, boot (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The version comes from packageManager in package.json, the same Bun the
      # image (Dockerfile) pins.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # The web app builds with `bun --bun next build`, as in the image.
      # Placeholder public values: the middleware refuses every request without a
      # Supabase URL and key, and NEXT_PUBLIC_* are inlined at build time.
      - run: bunx turbo build --filter=@marksyncr/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      # The standalone server must boot under Bun and answer its health check.
      - name: Standalone server answers under Bun
        run: |
          cp -r apps/web/public apps/web/.next/standalone/apps/web/
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/
          (cd apps/web/.next/standalone && PORT=3000 HOSTNAME=127.0.0.1 bun apps/web/server.js > /tmp/server.log 2>&1 &)
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health || true)
            [ "$code" = 200 ] && { echo "/api/health -> $code"; exit 0; }
            sleep 1
          done
          cat /tmp/server.log; exit 1
